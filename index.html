document.querySelectorAll('.shot').forEach(b=>b.addEventListener('click',()=>{const i=b.querySelector('img');li.src=i.src;li.alt=i.alt;lb.showModal()}));
lb.addEventListener('click',e=>{if(e.target===lb)lb.close()});
</script>
</body>
</html>
